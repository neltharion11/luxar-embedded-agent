{evidence: 'main.c called HAL_Init() first (SystemCoreClock=8MHz HSI), then SystemClock_Config()
switched to 72MHz PLL without re-initializing SysTick. SysTick reload stayed at 8000
ticks but ran at 72MHz → 72M/8000=9kHz → 0.111ms per tick. HAL_Delay(500) waited 500*0.111=55.5ms.
Verified by reordering to SystemClock_Config() first then HAL_Init(), which gave correct
500ms timing.', hypothesis: HAL_Init() configures SysTick before system clock is
set to final frequency, outcome: 'After reordering, HAL_Delay(500) produces exactly
500ms delay. Build and flash succeeded.', resolution: Always call SystemClock_Config()
BEFORE HAL_Init() so SysTick is configured with the final SystemCoreClock value, symptom: HAL_Delay(500)
produces only ~55ms instead of 500ms on STM32F103, topic: STM32 HAL_Delay timing
wrong after SystemClock_Config}
