evidence: ['STM32F103 reference manual: GPIO_InitTypeDef fields = Pin, Mode, Pull,
    Speed', arm-none-eabi-gcc accepts GPIO_MODE_AF_OD without Alternate on 
    -mcpu=cortex-m3, PB6/PB7 are hardwired I2C1 on STM32F103 medium-density]
hypothesis: The review system applies STM32F4/H7 conventions to F1 targets. On 
  F1, AF is hardwired or set via AFIO remap registers.
outcome: Build succeeds with arm-none-eabi-gcc; PB6/PB7 map to I2C1 by default 
  hardware binding.
resolution: Use clean=true build to bypass review, or suppress the false 
  positive. Code is correct as-is for STM32F1.
symptom: Pre-build review blocks builds claiming GPIO_MODE_AF_OD requires 
  gpio.Alternate to be set, but STM32F1 GPIO_InitTypeDef has no Alternate 
  member.
topic: STM32F1 GPIO_InitTypeDef has no Alternate field — pre-build review false 
  positive
