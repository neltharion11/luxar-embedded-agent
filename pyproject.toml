[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "luxar-langgraph"
version = "0.1.0"
description = "A clean, evidence-driven LUXAR implementation orchestrated by LangGraph."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph>=1.2,<1.3",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "lancedb>=0.25,<1",
    "pyserial>=3.5,<4",
    "PyYAML>=6,<7",
    "uvicorn>=0.35,<1",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[project.scripts]
luxar = "luxar.cli:main"
luxar-web = "luxar.web:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]
postgres = [
    "psycopg[binary,pool]>=3.2,<4",
    "langgraph-checkpoint-postgres>=3,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
luxar = ["ui/*.html", "database/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
